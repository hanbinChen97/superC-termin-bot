        \   <li><h2 class=\"h3like\">Auswahl der Beh\xF6rde</h2>\n        <p>Zun\xE4chst
        w\xE4hlen Sie bitte die gew\xFCnschte Beh\xF6rde aus den angebotenen Beh\xF6rden
        aus.</p></li>\n    <li><h2 class=\"h3like\">Auswahl des Anliegens</h2>\n        <p>Anschlie\xDFend
        erhalten Sie die zur Beh\xF6rde angebotenen Anliegen angezeigt, w\xE4hlen
        Sie entsprechend aus.</p>\n    </li>\n    <li><h2 class=\"h3like\">Terminauswahl</h2>\n
        \       <p>Anschlie\xDFend wird ein Kalender eingeblendet, aus dem die freien
        Zeiten hervorgehen. Rot gekennzeichnete\n            Bereiche bedeuten, dass
        zu diesen Zeiten keine Termin vergeben werden k\xF6nnen. Markieren Sie dann
        bitte ihren\n            Terminwunsch mit einem Mausklick im Kalender. Der
        Bereich wird dann gr\xFCn dargestellt. Die Angaben zum\n            Terminwunsch
        werden unterhalb der \xDCberschrift textlich angezeigt.<br> Je nach Konfiguration
        kann es auch\n            sein, dass anstatt des Kalenders, eine Seite mit
        Terminvorschl\xE4gen angezeigt wird. Die Vorschl\xE4ge lassen\n            sich
        nach Datum und Wochentag filtern. Bei Auswahl eines Termins werden Sie direkt
        auf die n\xE4chste Seite\n            weitergeleitet.</p></li>\n    <li><h2
        class=\"h3like\">Pers\xF6nliche Daten</h2>\n        <p>Es erscheint die Eingabemaske
        f\xFCr ihre pers\xF6nlichen Daten. Alle mit einem Sternchen (*) gekennzeichneten\n
        \           Felder sind Pflichtfelder und m\xFCssen ausgef\xFCllt werden.
        Es besteht die M\xF6glichkeit f\xFCr sp\xE4tere Anfragen die\n            pers\xF6nlichen
        Daten auf Ihrem PC zu speichern, eine erneute Angabe dieser Daten bei zuk\xFCnftigen
        Anfragen ist\n            dann nicht mehr erforderlich, abgesehen von evtl.
        \xC4nderungen die dann erfolgen k\xF6nnen wenn die neue Anfrage\n            erzeugt
        wird. Setzen Sie dazu bitte einen Haken in das Feld Pers\xF6nliche Daten f\xFCr
        zuk\xFCnftige Anfragen\n            speichern. Best\xE4tigen Sie die Anfrage,
        sofern n\xF6tig, nach der Eingabe des Sicherheitscodes, mit einem Klick\n
