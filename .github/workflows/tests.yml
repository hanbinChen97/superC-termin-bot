name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    env:
      DB_USER: ci_dummy
      DB_PASSWORD: ci_dummy
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: ci_dummy
      # gpt_call.py 在模块导入时检查此变量，CI 里提供占位值（测试不会真正调用 OpenAI）
      OPENAI_KEY: ci_dummy_key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q libpq-dev

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install respx pytest-mock vcrpy pytest-recording

      # ── 第一层：Unit + E2E (respx mock)，完全离线 ──────────────────
      - name: Run unit & E2E tests (offline)
        run: |
          PYTHONPATH=. pytest -m "not integration" -v --tb=long 2>&1 | tee /tmp/pytest_output.txt
          exit ${PIPESTATUS[0]}

      # ── 第二层：Integration (vcrpy cassette 回放)，也完全离线 ───────
      - name: Run integration tests (vcrpy cassette replay)
        run: |
          PYTHONPATH=. pytest -m integration -v --tb=long

      # 无论成功失败，上传 pytest 输出供下载诊断
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-py${{ matrix.python-version }}
          path: /tmp/pytest_output.txt
          retention-days: 3
